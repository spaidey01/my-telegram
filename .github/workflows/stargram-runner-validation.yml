name: Stargram runner validation

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/stargram-runner.sh"
      - "deploy/setup-vps.sh"
      - "deploy/deploy-vps.sh"
      - "tests/deployment-config.test.mjs"
      - "src/utils/productionConfig.js"
      - "tests/production-config.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stargram-runner-validation.yml"
  push:
    branches: [stargram_clone]
    paths:
      - "deploy/stargram-runner.sh"
      - "deploy/setup-vps.sh"
      - "deploy/deploy-vps.sh"
      - "tests/deployment-config.test.mjs"
      - "src/utils/productionConfig.js"
      - "tests/production-config.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stargram-runner-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and production config tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for pinned patched framework
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static analysis for setup runner
        run: shellcheck -S warning deploy/stargram-runner.sh
      - name: Check deployment script syntax
        run: npm run test:deployment
      - name: Test production configuration validation
        run: npm run test:production-config
