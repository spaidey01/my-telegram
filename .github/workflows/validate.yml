name: Validate
# lockfile synchronized

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - production-fixes

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node --check server/index.js

      - name: Start real coturn and verify REST authentication
        env:
          TURN_SECRET: ci-turn-shared-secret-0123456789
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          turnserver -n --log-file=stdout             --use-auth-secret             --static-auth-secret="$TURN_SECRET"             --realm=ci.turn.stargram.local             --fingerprint             --no-tls             --no-dtls             --no-multicast-peers             --allow-loopback-peers             --min-port=49160             --max-port=49200             > /tmp/coturn.log 2>&1 &
          for i in $(seq 1 20); do
            if turnutils_uclient -W "$TURN_SECRET" -p 3478 -y 127.0.0.1 >/tmp/turn-client.log 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/coturn.log
          cat /tmp/turn-client.log
          exit 1

      - run: npm run test:turn
      - run: npm run test:call-reliability
      - run: npm run test:integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/my_telegram_test
          secretKey: integration-test-secret-key-32-bytes-minimum
          CLIENT_ORIGIN: http://localhost:3000
          SOCKET_PORT: 3101
          REDIS_URL: redis://127.0.0.1:6379
